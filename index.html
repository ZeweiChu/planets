<!DOCTYPE html>
<html lang="en" dir="ltr" data-font="latin">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standing on Other Worlds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/overview/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1 id="title"></h1>
      <label class="langpick">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="8" cy="8" r="6.4"/><ellipse cx="8" cy="8" rx="2.8" ry="6.4"/><path d="M1.8 6h12.4M1.8 10h12.4"/></g></svg>
        <span class="sr" id="langLabel"></span>
        <select id="lang"></select>
      </label>
    </div>
    <p class="lede" id="lede" aria-live="polite"></p>
  </header>

  <nav class="strip" id="strip"><div class="sun" aria-hidden="true"></div></nav>
  <p class="scale-note" data-t="scaleNote"></p>

  <main class="detail" id="detail"></main>

  <section class="more" aria-labelledby="cmp-h">
    <h2 id="cmp-h" data-t="cmpTitle"></h2>
    <p class="sub" data-t="cmpSub"></p>
    <div class="tablewrap"><table id="cmp"></table></div>
  </section>

  <section class="more" aria-labelledby="big-h">
    <h2 id="big-h" data-t="bigTitle"></h2>
    <p class="sub" data-t="bigSub"></p>
    <div class="lessons">
      <article class="lesson">
        <h3 data-t="l1Title"></h3>
        <p data-t="l1p1"></p>
        <p data-t="l1p2"></p>
        <div class="fig" id="frost"></div>
      </article>
      <article class="lesson">
        <h3 data-t="l2Title"></h3>
        <p data-t="l2p1"></p>
        <p data-t="l2p2"></p>
        <div class="slider">
          <label for="temp" data-t="tempLabel"></label>
          <input type="range" id="temp" min="100" max="2000" step="50" value="1000">
          <output id="tempOut" for="temp"></output>
        </div>
        <div class="fig"><svg id="esc" viewBox="0 0 760 384" width="100%" style="min-width:620px" role="img"></svg></div>
        <p class="fine" id="escLegend"></p>
        <p class="fine" data-t="l2fine"></p>
      </article>
    </div>
  </section>

  <footer>
    <h2 data-t="srcTitle"></h2>
    <ul id="sources"></ul>
  </footer>
</div>

<script type="module" src="/src/overview/main.js"></script>
</body>
</html>
